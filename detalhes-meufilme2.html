<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes - Mad Max</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .btn-voltar {
            display: inline-block;
            margin-bottom: 25px;
            color: #66fcf1;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .btn-voltar:hover {
            opacity: 0.8;
        }

        .detalhes-container {
            background: rgba(31, 40, 51, 0.6);
            border: 1px solid rgba(102, 252, 241, 0.3);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            gap: 30px;
            backdrop-filter: blur(10px);
        }

        .poster-detalhes {
            width: 220px;
            flex-shrink: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #11141a;
        }

        .poster-detalhes img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .info-detalhes {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .titulo-filme {
            font-size: 2rem;
            color: #ffffff;
        }

        .meta-detalhes {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.9rem;
            color: #95a5a6;
        }

        .nota-tag {
            color: #f1c40f;
            font-weight: bold;
        }

        .stream-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .b-prime {
            background: rgba(0, 168, 225, 0.2);
            color: #33c2f5;
            border: 1px solid #00A8E1;
        }

        .sinopse-titulo {
            font-size: 1.2rem;
            color: #66fcf1;
            margin-top: 10px;
        }

        .sinopse-texto {
            line-height: 1.6;
            color: #c5c6c7;
        }

        @media (max-width: 600px) {
            .detalhes-container {
                flex-direction: column;
            }

            .poster-detalhes {
                width: 100%;
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="btn-voltar">← Voltar para o Portal</a>

        <div class="detalhes-container">
            <div class="poster-detalhes">
                <img src="https://www.cinebelasartes.com.br/wp-content/uploads/2022/11/Mad-Max-Estrada-da-Furi-600x855-min.jpeg" alt="Pôster do Filme">
            </div>

            <div class="info-detalhes">
                <h1 class="titulo-filme">Título do Seu Filme Recomendado 2</h1>
                
                <div class="meta-detalhes">
                    <span class="nota-tag">★ 8.8</span>
                    <span>•</span>
                    <span>Gênero Aqui</span>
                    <span>•</span>
                    <span>Duração</span>
                    <span class="stream-badge b-prime">Prime Video</span>
                </div>

                <h2 class="sinopse-titulo">Sinopse Completa</h2>
                <p class="sinopse-texto">
                    Escreva aqui a sinopse detalhada do segundo filme recomendado. Adicione informações sobre a trama, destaques de atuações ou direção, e o motivo dessa indicação.
                </p>
            </div>
        </div>
    </div>
</body>

</html>
